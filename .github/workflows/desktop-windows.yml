name: ILBI Windows desktop
on:
  workflow_dispatch:
    inputs:
      postgres_url:
        description: Verified EDB PostgreSQL 16 Windows x64 binaries ZIP HTTPS URL
        required: true
        type: string
      postgres_sha256:
        description: SHA256 of the verified PostgreSQL ZIP
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python desktop dependencies
        run: python desktop/install_build_dependencies.py
      - name: Download verified PostgreSQL binaries
        env:
          POSTGRES_URL: ${{ inputs.postgres_url }}
          POSTGRES_SHA256: ${{ inputs.postgres_sha256 }}
        shell: pwsh
        run: |
          $source = [Uri]$env:POSTGRES_URL
          if ($source.Scheme -ne 'https' -or $source.Host -notin @('get.enterprisedb.com', 'sbp.enterprisedb.com')) { throw 'Use the official EDB download host' }
          Invoke-WebRequest -Uri $source -OutFile postgres.zip
          python desktop/stage_postgres.py postgres.zip --sha256 $env:POSTGRES_SHA256
      - name: Build isolated backend
        run: python desktop/build_backend.py
      - name: Install frontend
        run: npm ci --prefix frontend/ilbi
      - name: Install desktop build tools
        run: npm ci --prefix desktop/ilbi
      - name: Verify desktop shell
        run: npm test --prefix desktop/ilbi
      - name: Build Windows installer
        run: npm run dist:win --prefix desktop/ilbi
      - uses: actions/upload-artifact@v4
        with:
          name: ILBI-Windows-x64
          path: desktop/ilbi/release/ILBI-Setup-*.exe
