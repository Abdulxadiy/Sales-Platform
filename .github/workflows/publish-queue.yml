name: Publish reviewed changes

on:
  schedule:
    # Lightweight hourly check; the release itself runs once per local day.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prepare and inspect the next batch without pushing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ilbi-commit-queue
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check today's release time and real queued work
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          arguments=()
          if [ "$MANUAL_RELEASE" = "true" ]; then arguments+=(--manual); fi
          python3 scripts/commit_queue.py gate "${arguments[@]}" > /tmp/release-gate.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('/tmp/release-gate.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"due={str(result['due']).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"{result['day']} {result['local_time']} {result['timezone']}: {result['reason']}\n")
          print(json.dumps(result))
          PY
  publish:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ilbi_test
          POSTGRES_USER: ilbi_test
          POSTGRES_PASSWORD: ilbi_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ilbi_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
    env:
      GH_TOKEN: ${{ github.token }}
      DJANGO_SETTINGS_MODULE: config.settings_test
      TEST_DB_NAME: ilbi_test
      TEST_DB_USER: ilbi_test
      TEST_DB_PASSWORD: ilbi_test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5433'
      TEST_REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate publisher
        run: python3 -m unittest discover -s tests/automation -v
      - name: Prepare, test and publish a real batch
        env:
          QUEUE_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          arguments=()
          if [ "$QUEUE_DRY_RUN" = "true" ]; then arguments+=(--dry-run); fi
          python3 scripts/commit_queue.py publish "${arguments[@]}"
      - name: Start CI for the published main commit
        env:
          QUEUE_DRY_RUN: ${{ inputs.dry_run || false }}
        run: bash scripts/dispatch_published_ci.sh
