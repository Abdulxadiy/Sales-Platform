<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B0D" stop-opacity="1" />
      <stop offset="38%" stop-color="#14100A" stop-opacity="1" />
      <stop offset="70%" stop-color="#0C0A09" stop-opacity="1" />
      <stop offset="100%" stop-color="#060504" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Metallic Gradients for Logo -->
    <linearGradient id="avatarAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="avatarAmberFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="avatarIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background Base -->
  <rect width="1024" height="1024" fill="url(#bgGlow)" />

  <!-- Soft Ambient Center Aura -->
  <circle cx="512" cy="512" r="420" fill="url(#centerAura)" />

  <!-- Subtle Outer Framing Ring (aligned with 1024 circle) -->
  <circle cx="512" cy="512" r="508" stroke="#F59E0B" stroke-opacity="0.12" stroke-width="4" />

  <!-- Main Concept 2 Modular Monogram (Scaled & Perfectly Centered for Circular Crop) -->
  <g filter="url(#logoGlow)" transform="translate(288, 204.8) scale(3.2)">
    
    <!-- TOP TIER MODULE -->
    <g id="topTier">
      <polygon
        points="70,16 122,44 70,72 18,44"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,26 108,46 70,66 32,46"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,44 18,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,44 122,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- MIDDLE TIER MODULE -->
    <g id="midTier">
      <polygon
        points="70,62 122,90 70,118 18,90"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,72 108,92 70,112 32,92"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,90 18,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,90 122,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- BOTTOM TIER MODULE (Full view, no clipping) -->
    <g id="botTier">
      <polygon
        points="70,108 122,136 70,164 18,136"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,118 108,138 70,158 32,138"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,136 18,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,136 122,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- DIAGONAL "I" MONOGRAM PILLAR -->
    <g id="monogramI">
      <polygon
        points="78,22 93,22 66,158 51,158"
        fill="url(#avatarIGrad)"
        stroke="#F59E0B"
        stroke-width="1.2"
      />
      <line
        x1="85"
        y1="26"
        x2="58"
        y2="154"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
