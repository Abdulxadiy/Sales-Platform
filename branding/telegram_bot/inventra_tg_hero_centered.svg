<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>

    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#241B0D" stop-opacity="1" />
      <stop offset="35%" stop-color="#14100A" stop-opacity="1" />
      <stop offset="70%" stop-color="#0C0A09" stop-opacity="1" />
      <stop offset="100%" stop-color="#060504" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="floorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Metallic Gradients for Logo -->
    <linearGradient id="avatarAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="avatarAmberFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="avatarIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1914" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#120E0A" stop-opacity="0.80" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.50" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.12" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>


    <!-- Shield Icon (24x24 viewBox) -->
    <g id="iconShield" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#F59E0B" fill-opacity="0.18"/>
      <path d="M9 12l2 2 4-4" stroke="#FEF08A" stroke-width="2.2"/>
    </g>

    <!-- Lightning Icon (24x24 viewBox) -->
    <g id="iconZap" fill="url(#avatarAmberGrad)" stroke="#FEF08A" stroke-width="1.2" stroke-linejoin="round">
      <path d="M13 2L3 14h8l-1 8 11-12h-8l1-8z" />
    </g>

    <!-- Chart Icon (24x24 viewBox) -->
    <g id="iconChart" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="9" />
      <line x1="12" y1="20" x2="12" y2="4" stroke="#FEF08A" />
      <line x1="6" y1="20" x2="6" y2="14" />
      <line x1="3" y1="20" x2="21" y2="20" stroke-width="1.8" />
    </g>

    <!-- Bell Notification Icon (24x24 viewBox) -->
    <g id="iconBell" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="#F59E0B" fill-opacity="0.18"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#FEF08A" />
    </g>

  </defs>

  <!-- Deep Obsidian Background Base -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Ambient Golden Bloom Behind Logo -->
  <circle cx="640" cy="235" r="390" fill="url(#centerAura)" />

  <!-- Subtle Concentric Tech Orbit Rings -->
  <circle cx="640" cy="235" r="280" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="640" cy="235" r="340" stroke="#F59E0B" stroke-opacity="0.05" stroke-width="1.2" />

  <!-- Floor Glow Reflection -->
  <ellipse cx="640" cy="370" rx="180" ry="24" fill="url(#floorAura)" />

  <!-- Logo (Centered at X=640, Y=220, scale=1.75) -->
  <g filter="url(#logoGlow)" transform="translate(517.5, 53) scale(1.75)">

    <!-- TOP TIER MODULE -->
    <g id="topTier">
      <polygon
        points="70,16 122,44 70,72 18,44"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,26 108,46 70,66 32,46"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,44 18,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,44 122,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- MIDDLE TIER MODULE -->
    <g id="midTier">
      <polygon
        points="70,62 122,90 70,118 18,90"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,72 108,92 70,112 32,92"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,90 18,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,90 122,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- BOTTOM TIER MODULE -->
    <g id="botTier">
      <polygon
        points="70,108 122,136 70,164 18,136"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,118 108,138 70,158 32,138"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,136 18,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,136 122,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- DIAGONAL "I" MONOGRAM PILLAR -->
    <g id="monogramI">
      <polygon
        points="78,22 93,22 66,158 51,158"
        fill="url(#avatarIGrad)"
        stroke="#F59E0B"
        stroke-width="1.2"
      />
      <line
        x1="85"
        y1="26"
        x2="58"
        y2="154"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </g>

  </g>

  <!-- Brand Typography -->
  <g id="brandText" text-anchor="middle">
    <!-- Main INVENTRA Title -->
    <text x="640" y="440" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="52" font-weight="800" fill="url(#textGoldGrad)" letter-spacing="14">INVENTRA</text>

    <!-- Subtitle: Savdo & POS Platformasi -->
    <text x="640" y="490" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#D4CEBF" letter-spacing="6">SAVDO &amp; POS BOSHQARUV TIZIMI</text>
  </g>

  <!-- Feature Pills / Badges -->
  <g transform="translate(640, 560)">
    <!-- Pill 1: 2FA & Xavfsizlik -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="200" height="44" rx="22" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.4" />
      <g transform="translate(18, 11) scale(0.9)">
        <use href="#iconShield" />
      </g>
      <text x="114" y="27" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FEF08A" text-anchor="middle" letter-spacing="1">2FA XAVFSIZLIK</text>
    </g>

    <!-- Pill 2: Rasmiy Telegram Bot (Highlighted) -->
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="220" height="44" rx="22" fill="#F59E0B" fill-opacity="0.22" stroke="#FBBF24" stroke-width="1.6" />
      <g transform="translate(18, 11) scale(0.9)">
        <use href="#iconZap" />
      </g>
      <text x="122" y="27" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">RASMIY TELEGRAM BOT</text>
    </g>

    <!-- Pill 3: Tezkor Xabarlar -->
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="200" height="44" rx="22" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.4" />
      <g transform="translate(18, 11) scale(0.9)">
        <use href="#iconBell" />
      </g>
      <text x="114" y="27" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FEF08A" text-anchor="middle" letter-spacing="1">TEZKOR XABARLAR</text>
    </g>
  </g>

  <!-- Bottom subtle line accent -->
  <line x1="440" y1="645" x2="840" y2="645" stroke="#F59E0B" stroke-opacity="0.18" stroke-width="1" />
</svg>
