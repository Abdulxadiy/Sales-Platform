<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>

    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#241B0D" stop-opacity="1" />
      <stop offset="35%" stop-color="#14100A" stop-opacity="1" />
      <stop offset="70%" stop-color="#0C0A09" stop-opacity="1" />
      <stop offset="100%" stop-color="#060504" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="floorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Metallic Gradients for Logo -->
    <linearGradient id="avatarAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="avatarAmberFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="avatarIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1914" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#120E0A" stop-opacity="0.80" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.50" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.12" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

  </defs>

  <!-- Deep Obsidian Background Base -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Soft Ambient Center Aura -->
  <circle cx="640" cy="275" r="430" fill="url(#centerAura)" />

  <!-- Outer Framing Rings (aligned with luxury circular identity) -->
  <circle cx="640" cy="275" r="275" stroke="#F59E0B" stroke-opacity="0.10" stroke-width="2.5" />
  <circle cx="640" cy="275" r="325" stroke="#F59E0B" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="10 8" />

  <!-- Floor Glow Reflection -->
  <ellipse cx="640" cy="445" rx="190" ry="26" fill="url(#floorAura)" />

  <!-- Main Concept 2 Modular Monogram (Scaled & Perfectly Centered) -->
  <g filter="url(#logoGlow)" transform="translate(489.5, 70) scale(2.15)">

    <!-- TOP TIER MODULE -->
    <g id="topTier">
      <polygon
        points="70,16 122,44 70,72 18,44"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,26 108,46 70,66 32,46"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,44 18,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,44 122,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- MIDDLE TIER MODULE -->
    <g id="midTier">
      <polygon
        points="70,62 122,90 70,118 18,90"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,72 108,92 70,112 32,92"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,90 18,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,90 122,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- BOTTOM TIER MODULE -->
    <g id="botTier">
      <polygon
        points="70,108 122,136 70,164 18,136"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,118 108,138 70,158 32,138"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,136 18,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,136 122,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- DIAGONAL "I" MONOGRAM PILLAR -->
    <g id="monogramI">
      <polygon
        points="78,22 93,22 66,158 51,158"
        fill="url(#avatarIGrad)"
        stroke="#F59E0B"
        stroke-width="1.2"
      />
      <line
        x1="85"
        y1="26"
        x2="58"
        y2="154"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </g>

  </g>

  <!-- Minimal Brand Title -->
  <g id="minimalTitle" text-anchor="middle">
    <text x="640" y="535" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="52" font-weight="800" fill="url(#textGoldGrad)" letter-spacing="18">INVENTRA</text>
    
    <!-- Hairline Golden Divider -->
    <line x1="490" y1="565" x2="790" y2="565" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />

    <text x="640" y="605" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#B5AD9F" letter-spacing="8">RASMIY TELEGRAM BOT</text>
  </g>
</svg>
