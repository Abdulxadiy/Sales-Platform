<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>

    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#241B0D" stop-opacity="1" />
      <stop offset="35%" stop-color="#14100A" stop-opacity="1" />
      <stop offset="70%" stop-color="#0C0A09" stop-opacity="1" />
      <stop offset="100%" stop-color="#060504" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="floorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Metallic Gradients for Logo -->
    <linearGradient id="avatarAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="avatarAmberFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="avatarIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1914" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#120E0A" stop-opacity="0.80" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.50" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.12" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>


    <!-- Shield Icon (24x24 viewBox) -->
    <g id="iconShield" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#F59E0B" fill-opacity="0.18"/>
      <path d="M9 12l2 2 4-4" stroke="#FEF08A" stroke-width="2.2"/>
    </g>

    <!-- Lightning Icon (24x24 viewBox) -->
    <g id="iconZap" fill="url(#avatarAmberGrad)" stroke="#FEF08A" stroke-width="1.2" stroke-linejoin="round">
      <path d="M13 2L3 14h8l-1 8 11-12h-8l1-8z" />
    </g>

    <!-- Chart Icon (24x24 viewBox) -->
    <g id="iconChart" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="9" />
      <line x1="12" y1="20" x2="12" y2="4" stroke="#FEF08A" />
      <line x1="6" y1="20" x2="6" y2="14" />
      <line x1="3" y1="20" x2="21" y2="20" stroke-width="1.8" />
    </g>

    <!-- Bell Notification Icon (24x24 viewBox) -->
    <g id="iconBell" fill="none" stroke="url(#avatarAmberGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="#F59E0B" fill-opacity="0.18"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#FEF08A" />
    </g>

  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Left Ambient Golden Bloom -->
  <circle cx="310" cy="300" r="360" fill="url(#centerAura)" />

  <!-- Floor Reflection on Left -->
  <ellipse cx="310" cy="455" rx="160" ry="22" fill="url(#floorAura)" />

  <!-- Left Logo (Centered at X=310, Y=280, scale=1.9) -->
  <g filter="url(#logoGlow)" transform="translate(177, 98.5) scale(1.9)">

    <!-- TOP TIER MODULE -->
    <g id="topTier">
      <polygon
        points="70,16 122,44 70,72 18,44"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,26 108,46 70,66 32,46"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,44 18,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,44 122,55 70,83 70,72"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- MIDDLE TIER MODULE -->
    <g id="midTier">
      <polygon
        points="70,62 122,90 70,118 18,90"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,72 108,92 70,112 32,92"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,90 18,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,90 122,101 70,129 70,118"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- BOTTOM TIER MODULE -->
    <g id="botTier">
      <polygon
        points="70,108 122,136 70,164 18,136"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <polygon
        points="70,118 108,138 70,158 32,138"
        fill="#F59E0B"
        fill-opacity="0.14"
        stroke="#FBBF24"
        stroke-width="1.6"
      />
      <polygon
        points="18,136 18,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
      <polygon
        points="122,136 122,147 70,175 70,164"
        fill="url(#avatarAmberFill)"
        stroke="url(#avatarAmberGrad)"
        stroke-width="2.8"
      />
    </g>

    <!-- DIAGONAL "I" MONOGRAM PILLAR -->
    <g id="monogramI">
      <polygon
        points="78,22 93,22 66,158 51,158"
        fill="url(#avatarIGrad)"
        stroke="#F59E0B"
        stroke-width="1.2"
      />
      <line
        x1="85"
        y1="26"
        x2="58"
        y2="154"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </g>

  </g>

  <!-- Left Brand Typography -->
  <g id="leftBrand" text-anchor="middle">
    <!-- INVENTRA -->
    <text x="310" y="525" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="44" font-weight="800" fill="url(#textGoldGrad)" letter-spacing="12">INVENTRA</text>
    
    <!-- Badge: OFFICIAL BOT -->
    <g transform="translate(225, 545)">
      <rect x="0" y="0" width="170" height="28" rx="6" fill="#F59E0B" />
      <text x="85" y="19" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="12" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="2">OFFICIAL BOT</text>
    </g>

    <text x="310" y="605" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="600" fill="#B5AD9F" letter-spacing="3">SAVDO &amp; POS PLATFORMASI</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="570" y1="100" x2="570" y2="620" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1.2" stroke-dasharray="6 6" />

  <!-- Right Side: 3 Feature Cards (What can this bot do?) -->
  <g id="featureCards" transform="translate(610, 110)">

    <!-- Card 1: 2FA & Security -->
    <g transform="translate(0, 0)">
      <rect width="580" height="140" rx="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.4" />
      
      <!-- Icon Box -->
      <rect x="24" y="32" width="76" height="76" rx="16" fill="#F59E0B" fill-opacity="0.14" stroke="#FBBF24" stroke-width="1.2" />
      <g transform="translate(42, 50) scale(1.65)">
        <use href="#iconShield" />
      </g>
      
      <!-- Text -->
      <text x="124" y="62" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#FEF08A">2-Bosqichli Xavfsizlik (2FA)</text>
      <text x="124" y="96" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#D4CEBF">Platformaga kirishda tasdiqlash kodlarini (OTP)</text>
      <text x="124" y="118" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#B5AD9F">bir zumda xavfsiz qabul qilish.</text>
    </g>

    <!-- Card 2: Sales & Warehouse -->
    <g transform="translate(0, 165)">
      <rect width="580" height="140" rx="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.4" />
      
      <!-- Icon Box -->
      <rect x="24" y="32" width="76" height="76" rx="16" fill="#F59E0B" fill-opacity="0.14" stroke="#FBBF24" stroke-width="1.2" />
      <g transform="translate(42, 50) scale(1.65)">
        <use href="#iconChart" />
      </g>
      
      <!-- Text -->
      <text x="124" y="62" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#FEF08A">Savdo &amp; Kassa Nazorati</text>
      <text x="124" y="96" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#D4CEBF">Do‘kon tushumlari, kunlik savdo ko‘rsatkichlari</text>
      <text x="124" y="118" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#B5AD9F">va ombor qoldiqlarini monitoring qilish.</text>
    </g>

    <!-- Card 3: Instant Notifications -->
    <g transform="translate(0, 330)">
      <rect width="580" height="140" rx="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.4" />
      
      <!-- Icon Box -->
      <rect x="24" y="32" width="76" height="76" rx="16" fill="#F59E0B" fill-opacity="0.14" stroke="#FBBF24" stroke-width="1.2" />
      <g transform="translate(42, 50) scale(1.65)">
        <use href="#iconBell" />
      </g>
      
      <!-- Text -->
      <text x="124" y="62" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#FEF08A">Tezkor Xabarnomalar</text>
      <text x="124" y="96" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#D4CEBF">Har bir tranzaksiya, muhim ogohlantirish</text>
      <text x="124" y="118" font-family="Google Sans Flex, DejaVu Sans, sans-serif" font-size="14.5" font-weight="500" fill="#B5AD9F">va tizim hodisalari haqida zudlik bilan bildirish.</text>
    </g>

  </g>
</svg>
