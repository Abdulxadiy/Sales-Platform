# Standalone production layout; TLS terminates at the frontend Nginx edge.
# docker compose --env-file .env.production -f docker-compose.prod.yml ...
name: ${COMPOSE_PROJECT_NAME:-ilbi-platform}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  ilbi:
    build: ./ilbi
    restart: unless-stopped
    env_file: ./ilbi/.env.production
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_DEBUG: 'False'
      LOCAL_DEMO_LOGIN_ENABLED: 'False'
      GUNICORN_RELOAD: 'False'
      ALLOWED_HOSTS: '${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production},ilbi'
      FRONTEND_URL: 'https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}'
      SECURE_HSTS_SECONDS: '${SECURE_HSTS_SECONDS:-3600}'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./docs:/app/docs
    healthcheck:
      test: [CMD, python, -B, healthcheck.py]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 3
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery_worker:
    build: ./ilbi
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: ./ilbi/.env.production
    environment: *backend_environment
    depends_on:
      ilbi: {condition: service_healthy}
  celery_beat:
    build: ./ilbi
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: ./ilbi/.env.production
    environment: *backend_environment
    depends_on:
      ilbi: {condition: service_healthy}
  bot:
    build: ./telegram_bot_sms
    restart: unless-stopped
    env_file: ./telegram_bot_sms/.env.production
    depends_on:
      ilbi: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend/ilbi
      target: production
    restart: unless-stopped
    environment:
      PUBLIC_HOST: '${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}'
      SECURE_HSTS_SECONDS: '${SECURE_HSTS_SECONDS:-3600}'
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_HOST|SECURE_HSTS_SECONDS)$'
    ports: ['80:80', '443:443']
    volumes:
      - static_data:/var/www/static:ro
      - type: bind
        source: '${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}'
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ilbi: {condition: service_healthy}
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  minio_data:
