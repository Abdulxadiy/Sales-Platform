# Sales-Platform/docker-compose.yml

networks:
  inventra_net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  minio_data:
  static_data:
  inventra_venv:
  bot_venv:
  frontend_node_modules:

services:

  # -------------------------------------------------------------------
  # POSTGRES — asosiy ma'lumotlar bazasi
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - inventra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # REDIS — Kesh, OTP va Celery Broker
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - inventra_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # MINIO — S3 mos media server (rasmlar va fayllar)
  # -------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inventra_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # INVENTRA — Django/DRF asosiy backend
  # -------------------------------------------------------------------
  inventra:
    build:
      context: ./inventra
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./inventra/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,inventra,nginx,*"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./inventra:/app
      - ./docs:/app/docs
      - ./docs:/docs
      - inventra_venv:/app/.venv
      - static_data:/app/staticfiles
    expose:
      - "8000"
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # CELERY WORKER — fonga olingan vazifalar ijrochisi
  # -------------------------------------------------------------------
  celery_worker:
    build:
      context: ./inventra
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./inventra/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      C_FORCE_ROOT: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inventra:
        condition: service_started
    volumes:
      - ./inventra:/app
      - inventra_venv:/app/.venv
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # CELERY BEAT — davriy rejali vazifalar (Cron)
  # -------------------------------------------------------------------
  celery_beat:
    build:
      context: ./inventra
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - ./inventra/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      C_FORCE_ROOT: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inventra:
        condition: service_started
    volumes:
      - ./inventra:/app
      - inventra_venv:/app/.venv
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # BOT — aiogram orqali Telegram bilan ishlaydigan servis
  # -------------------------------------------------------------------
  bot:
    build:
      context: ./telegram_bot_sms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./telegram_bot_sms/.env
    depends_on:
      - inventra
    volumes:
      - ./telegram_bot_sms:/app
      - bot_venv:/app/.venv
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # NGINX — Teskari proksi (Reverse Proxy) & Static/Media server
  # -------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/var/www/static:ro
      - ./inventra/media:/var/www/media:ro
    depends_on:
      - inventra
    networks:
      - inventra_net

  # -------------------------------------------------------------------
  # FRONTEND — React (Vite) ilovasi (Dev rejimida)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/inventra
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://nginx:80
    volumes:
      - ./frontend/inventra:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx
    networks:
      - inventra_net

