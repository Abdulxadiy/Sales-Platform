# ILBI development services. Local .env pins the existing resource mapping.
name: ${COMPOSE_PROJECT_NAME:-ilbi-platform}

networks:
  ilbi_net:
    name: ${ILBI_NETWORK_NAME:-${COMPOSE_PROJECT_NAME:-ilbi-platform}_ilbi_net}
    external: ${ILBI_NETWORK_EXTERNAL:-false}

volumes:
  redis_data:
  postgres_data:
  minio_data:
  static_data:
  ilbi_venv:
    name: ${ILBI_VENV_VOLUME:-${COMPOSE_PROJECT_NAME:-ilbi-platform}_ilbi_venv}
    external: ${ILBI_VENV_EXTERNAL:-false}
  bot_venv:
  frontend_node_modules:

services:

  # -------------------------------------------------------------------
  # POSTGRES — asosiy ma'lumotlar bazasi
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ilbi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------
  # REDIS — Kesh, OTP va Celery Broker
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ilbi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # MINIO — S3 mos media server (rasmlar va fayllar)
  # -------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ilbi_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ilbi_net

  # -------------------------------------------------------------------
  # ILBI — Django/DRF asosiy backend
  # -------------------------------------------------------------------
  ilbi:
    build:
      context: ./ilbi
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ilbi/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,ilbi,inventra,nginx,ilbi.uz,www.ilbi.uz"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./ilbi:/app
      - ./docs:/app/docs
      - ./docs:/docs
      - ilbi_venv:/app/.venv
      - static_data:/app/staticfiles
    expose:
      - "8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      ilbi_net:
        aliases: [inventra]

  # -------------------------------------------------------------------
  # CELERY WORKER — fonga olingan vazifalar ijrochisi
  # -------------------------------------------------------------------
  celery_worker:
    build:
      context: ./ilbi
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./ilbi/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      C_FORCE_ROOT: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ilbi:
        condition: service_started
    volumes:
      - ./ilbi:/app
      - ilbi_venv:/app/.venv
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ilbi_net

  # -------------------------------------------------------------------
  # CELERY BEAT — davriy rejali vazifalar (Cron)
  # -------------------------------------------------------------------
  celery_beat:
    build:
      context: ./ilbi
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - ./ilbi/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      C_FORCE_ROOT: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ilbi:
        condition: service_started
    volumes:
      - ./ilbi:/app
      - ilbi_venv:/app/.venv
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ilbi_net

  # -------------------------------------------------------------------
  # BOT — aiogram orqali Telegram bilan ishlaydigan servis
  # -------------------------------------------------------------------
  bot:
    build:
      context: ./telegram_bot_sms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./telegram_bot_sms/.env
    depends_on:
      - ilbi
    volumes:
      - ./telegram_bot_sms:/app
      - bot_venv:/app/.venv
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ilbi_net

  # -------------------------------------------------------------------
  # NGINX — Teskari proksi (Reverse Proxy) & Static/Media server
  # -------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/var/www/static:ro
      - ./ilbi/media:/var/www/media:ro
    depends_on:
      - ilbi
    networks:
      - ilbi_net

  # -------------------------------------------------------------------
  # FRONTEND — React (Vite) ilovasi (Dev rejimida)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/ilbi
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_TARGET=http://nginx:80
    volumes:
      - ./frontend/ilbi:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx
    networks:
      - ilbi_net

