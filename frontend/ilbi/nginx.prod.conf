# This template is included in http{} by the production Nginx image.
# Use the normalized URI: query strings, escaped characters and an omitted
# trailing slash must not create a new bucket. Never key limits on client headers.
map $uri $ilbi_request_class {
    default "";
    ~^/api/v1/auth/(admin-login(/(send-otp|verify-otp))?|password-reset/(request|verify|confirm|resume|change-with-old)|change-password)/?$ auth;
    ~^/api/ api;
}
map $ilbi_request_class $ilbi_auth_limit_key {
    default "";
    auth $binary_remote_addr;
}
map $ilbi_request_class $ilbi_api_limit_key {
    default "";
    api $binary_remote_addr;
}
map $ilbi_request_class $ilbi_retry_after {
    default 1;
    auth 2;
}
# Shared across workers of this Nginx instance; empty keys are not counted.
# These are sustained rates with a short burst allowance, not fixed windows.
limit_req_zone $ilbi_auth_limit_key zone=ilbi_auth:10m rate=60r/m;
limit_req_zone $ilbi_api_limit_key zone=ilbi_api:10m rate=60r/s;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${PUBLIC_HOST};
    # A constant destination prevents Host-header-controlled redirects.
    return 308 https://${PUBLIC_HOST}$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name ${PUBLIC_HOST};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ILBI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;

    location = /api/v1/internal { return 403; }
    location ^~ /api/v1/internal/ { return 403; }
    location ~ ^/(api|media)/ {
        # Separate budgets keep login abuse from using the POS API allowance.
        limit_req zone=ilbi_auth burst=30 nodelay;
        limit_req zone=ilbi_api burst=120 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @ilbi_rate_limited;
        # Keep application-level 429 bodies and Retry-After values unchanged.
        proxy_intercept_errors off;
        set $ilbi_backend http://ilbi:8000;
        proxy_pass $ilbi_backend;
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header Strict-Transport-Security;
    }
    location @ilbi_rate_limited {
        default_type application/json;
        add_header Retry-After $ilbi_retry_after always;
        add_header Cache-Control no-store always;
        # Local add_header directives disable inheritance of the server headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;
        return 429 '{"error":{"code":"throttled","message":"So‘rovlar juda ko‘p. Biroz kutib, qayta urinib ko‘ring.","details":null}}';
    }
    location /static/ { alias /var/www/static/; }
    location = /downloads/releases.json {
        alias /var/www/downloads/releases.json;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;
    }
    location ^~ /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        default_type application/octet-stream;
        types { application/octet-stream exe apk; }
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx stops inheriting parent add_header directives in this location.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
