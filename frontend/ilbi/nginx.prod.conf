server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${PUBLIC_HOST};
    # A constant destination prevents Host-header-controlled redirects.
    return 308 https://${PUBLIC_HOST}$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name ${PUBLIC_HOST};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ILBI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;

    location = /api/v1/internal { return 403; }
    location ^~ /api/v1/internal/ { return 403; }
    location ~ ^/(api|media)/ {
        set $ilbi_backend http://ilbi:8000;
        proxy_pass $ilbi_backend;
        proxy_set_header Host ${PUBLIC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header Strict-Transport-Security;
    }
    location /static/ { alias /var/www/static/; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx stops inheriting parent add_header directives in this location.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
