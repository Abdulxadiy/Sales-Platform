[project]
name = "inventra"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.105",
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-storages>=1.14.6",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.17.1",
    "drf-spectacular>=0.30.0",
    "gevent>=26.8.0",
    "gunicorn>=26.1.0",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
