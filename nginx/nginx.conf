events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_api_limit:10m rate=10r/m;
    limit_req_status 429;

    # Docker internal DNS resolver with 5s cache TTL
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Static assets
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # Media assets (avatars, product pictures)
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri $uri/ =404;
        }

        # Block external access to internal microservice endpoints
        location /api/v1/internal/ {
            default_type application/json;
            return 403 '{"error": {"code": "forbidden", "message": "Access restricted to internal network only."}}';
        }

        # Stricter rate limit on sensitive authentication endpoints
        location ~ ^/api/v1/auth/(admin-login|request-otp|verify-otp|password-reset)/ {
            limit_req zone=auth_api_limit burst=5 nodelay;
            set $inventra_backend http://inventra:8000;
            proxy_pass $inventra_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API, Admin, OpenAPI Docs, and Django application
        location / {
            limit_req zone=general_api_limit burst=20 nodelay;
            set $inventra_backend http://inventra:8000;
            proxy_pass $inventra_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
