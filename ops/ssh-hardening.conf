# Installed as /etc/ssh/sshd_config.d/00-ilbi-hardening.conf.
# Local SSH forwarding remains available for private site previews.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
MaxAuthTries 4
LoginGraceTime 30
